name: Update dashboard and deploy Pages

on:
  schedule:
    # 每 30 分钟一次；GitHub 的高峰时段可能略有延迟
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Shanghai
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore previous snapshots
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.aimonitor/data
          key: aimon-data-${{ github.run_id }}
          restore-keys: |
            aimon-data-

      - name: Generate dashboard
        id: update
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.aimonitor"
          cp aimon.py template.html config.json "$HOME/.aimonitor/"
          python3 "$HOME/.aimonitor/aimon.py" update --quiet
          mkdir -p public
          cp "$HOME/.aimonitor/dashboard.html" public/index.html
          cp README.md public/README.md

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Save snapshots
        if: steps.update.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: /home/runner/.aimonitor/data
          key: aimon-data-${{ github.run_id }}

      - name: Daily heartbeat
        if: success()
        run: |
          date -u +'%Y-%m-%d' > last-run.txt
          if ! git diff --quiet -- last-run.txt; then
            git config user.name "aimon-bot"
            git config user.email "aimon-bot@users.noreply.github.com"
            git add last-run.txt
            git commit -m "chore: daily heartbeat [skip ci]"
            git push || true
          fi
